  "check-wasm",
  "check-zed",
  "check-zed-wasm",
  "check-vscode",
  "clippy-zed",
  "test-web-worker",
  "protocol-check",
  "test-zed",
  "test-vscode",
  "test-vscode-extension-host",
  "test-vscode-release-package",
  "test-cross-runtime",
]

[tasks.quality]
description = "Run every merge-time source gate without release-candidate work"
dependencies = ["quality-fast", "quality-rust", "quality-adapters"]

[tasks.verify]
description = "Run the canonical local pull request gate"
dependencies = [
  "quality",
  "dependency-governance",
  "fuzz",
  "nix-package-check",
]

[tasks.ci]
description = "Alias for the canonical local pull request gate"
