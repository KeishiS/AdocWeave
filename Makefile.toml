[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "verify"

[tasks.fmt-workspace]
description = "Format workspace Rust source files"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-zed]
description = "Format the excluded Zed extension crate"
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml"]

[tasks.fmt]
description = "Format workspace and Zed extension Rust source files"
dependencies = ["fmt-workspace", "fmt-zed"]

[tasks.format]
description = "Alias for fmt"
alias = "fmt"

[tasks.fmt-check-workspace]
description = "Check workspace Rust formatting without changing files"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-check-zed]
description = "Check Zed extension formatting without changing files"
command = "cargo"
args = [
  "fmt",
  "--manifest-path",
  "editors/zed/Cargo.toml",
  "--",
  "--check",
]

[tasks.fmt-check]
description = "Check all Rust formatting without changing files"
dependencies = ["fmt-check-workspace", "fmt-check-zed"]

[tasks.format-check]
description = "Alias for fmt-check"
alias = "fmt-check"

[tasks.check]
description = "Type-check all workspace targets and features"
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features"]

[tasks.clippy]
description = "Run Clippy for all workspace targets and features"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.test]
description = "Run all workspace tests"
command = "cargo"
args = ["test", "--workspace", "--all-features"]

[tasks.test-core]
description = "Run parser, renderer, lint, and formatter tests"
command = "cargo"
args = ["test", "-p", "adocweave", "--all-features"]

[tasks.test-cli]
description = "Run command-line adapter tests"
command = "cargo"
args = ["test", "-p", "adocweave-cli", "--all-features"]

[tasks.test-lsp]
description = "Run Language Server tests"
command = "cargo"
args = ["test", "-p", "adocweave-lsp", "--all-features"]

[tasks.test-wasm-api]
description = "Run the native WASM API contract tests"
command = "cargo"
args = ["test", "-p", "adocweave-wasm", "--all-features"]

[tasks.test-web-worker]
description = "Run the Web Worker protocol tests"
command = "npm"
args = ["test", "--prefix", "web-worker"]

[tasks.protocol-check]
description = "Verify generated protocol files and the real WASM accept/reject contract"
dependencies = [
  "protocol-generated-check",
  "protocol-corpus-check",
  "protocol-wasm-corpus-check",
  "test-browser-types",
]

[tasks.protocol-generated-check]
dependencies = ["protocol-rust-codegen-test"]
command = "node"
args = ["tools/generate-protocol.mjs", "--check"]

[tasks.protocol-rust-codegen-test]
command = "node"
args = ["--test", "tools/protocol-rust-codegen.test.mjs"]

[tasks.protocol-corpus-check]
command = "cargo"
args = ["test", "-p", "adocweave-wasm", "--test", "protocol_contract"]

[tasks.protocol-wasm-corpus-check]
description = "Verify the request corpus through the generated wasm-bindgen boundary"
dependencies = ["build-wasm-node"]
command = "node"
args = ["--test", "web-worker/protocol-wasm.test.mjs"]

[tasks.release-contract]
description = "Verify release train versions, targets, tags, and distribution manifest schema"
dependencies = [
  "release-version-check",
  "release-metadata-test",
  "release-notes-test",
  "release-workflow-policy",
  "semver-gate-test",
]
script_runner = "@shell"
script = '''
args=""
metadata="$(mktemp "${TMPDIR:-/tmp}/adocweave-release-metadata.XXXXXX.json")"
zed_metadata="$(mktemp "${TMPDIR:-/tmp}/adocweave-zed-release-metadata.XXXXXX.json")"
notice="$(mktemp "${TMPDIR:-/tmp}/adocweave-third-party-notices.XXXXXX.adoc")"
trap 'rm -f "$metadata" "$zed_metadata" "$notice"' EXIT
if [ -n "${RELEASE_TAG:-}" ]; then
  args="--tag=$RELEASE_TAG"
fi
node tools/release-contract.mjs $args
node tools/release-contract.test.mjs
cargo metadata --locked --format-version=1 > "$metadata"
cargo metadata --manifest-path editors/zed/Cargo.toml --locked --format-version=1 > "$zed_metadata"
node tools/verify-cargo-release-metadata.mjs "$metadata" "$zed_metadata"
node tools/generate-third-party-notices.mjs "$notice"
'''

[tasks.release-version-check]
description = "Verify the explicit release version allowlist and generated outputs"
dependencies = ["release-version-sync-test"]
command = "node"
args = ["tools/sync-release-version.mjs", "--check"]

[tasks.release-version-sync-test]
description = "Test deterministic release version updates and fail-closed behavior"
command = "node"
args = ["--test", "tools/sync-release-version.test.mjs"]

[tasks.release-metadata-test]
description = "Test canonical release manifest, SPDX SBOM, and checksum generation"
command = "node"
args = ["--test", "tools/release-metadata.test.mjs"]

[tasks.semver-check]
description = "Compare the candidate public Rust API against the previous stable tag"
dependencies = ["semver-gate-test"]
command = "node"
args = ["tools/semver-gate.mjs"]

[tasks.semver-gate-test]
description = "Test release step derivation, baseline selection, and fail-closed behavior"
command = "node"
args = ["--test", "tools/semver-gate.test.mjs"]

[tasks.dependency-governance]
description = "Audit every dependency boundary, license, source, advisory, and exception"
dependencies = ["dependency-governance-test"]
script_runner = "@shell"
script = '''
tools/dependency-governance.sh
'''

[tasks.dependency-governance-test]
description = "Test dependency boundary and exception policy"
command = "node"
args = [
  "--test",
  "tools/verify-dependency-boundaries.test.mjs",
  "tools/verify-vscode-dependencies.test.mjs",
]

[tasks.third-party-notices]
description = "Generate the release third-party notices from locked Cargo metadata"
command = "node"
args = ["tools/generate-third-party-notices.mjs", "target/THIRD_PARTY_NOTICES.adoc"]

[tasks.release-notes-test]
description = "Verify mandatory GitHub Release note sections"
command = "node"
args = ["--test", "tools/release-notes.test.mjs"]

[tasks.release-workflow-policy]
description = "Test action pins, release permissions, fork isolation, and transactional publication policy"
script_runner = "@shell"
script = '''
node tools/release-workflow-policy.mjs
node --test \
  tools/release-workflow-policy.test.mjs \
  tools/browser-release-budget.test.mjs \
  tools/browser-release-smoke.test.mjs
'''

[tasks.workflow-lint]
description = "Lint GitHub Actions syntax and enforce the release security policy"
dependencies = ["release-workflow-policy"]
command = "actionlint"
args = [
  "-ignore",
  'unknown permission scope "vulnerability-alerts"',
]

[tasks.release-ci-contract]
description = "Run the release contract, workflow lint, and cargo-dist plan used by pull requests"
dependencies = ["release-contract", "workflow-lint", "dist-plan"]

[tasks.platform-contract]
description = "Verify Windows and macOS release contracts without requiring the target operating system"
command = "node"
args = [
  "--test",
  "tools/native-lsp-smoke.test.mjs",
  "tools/platform-contract.test.mjs",
  "tools/release-installation-e2e.test.mjs",
  "tools/native-change-plan.test.mjs",
  "tools/verify-native-pr-candidate.test.mjs",
  "tools/config-schema.test.mjs",
]

[tasks.check-windows-target]
description = "Type-check native crates for the supported Windows target without linking"
command = "cargo"
args = [
  "check",
  "--workspace",
  "--all-features",
  "--target",
  "x86_64-pc-windows-msvc",
]

[tasks.check-macos-target]
description = "Type-check native crates for the supported macOS target without linking"
command = "cargo"
args = [
  "check",
  "--workspace",
  "--all-features",
  "--target",
  "aarch64-apple-darwin",
]

[tasks.cross-native-check]
description = "Type-check supported Windows and macOS targets without linking or executing"
dependencies = ["check-windows-target", "check-macos-target"]

[tasks.dev-tools-check]
description = "Verify that the flake development shell exposes every repository tool entry point"
script_runner = "@shell"
script = '''
missing=0
for tool in actionlint adocweave-fuzz cargo cargo-audit cargo-deny cargo-make cargo-clippy dist esbuild fc-list gh git jq node npm rg rustc rustfmt sha256sum tar tsc wasm-bindgen xz yq; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    echo "missing development tool: $tool" >&2
    missing=1
  fi
done
browser="${ADOCWEAVE_BROWSER:-chromium}"
if ! command -v "$browser" >/dev/null 2>&1; then
  echo "missing browser: $browser" >&2
  missing=1
fi
exit "$missing"
'''

[tasks.flake-check]
description = "Evaluate the Nix flake without building every output"
command = "nix"
args = ["flake", "check", "--no-build"]

[tasks.native-release-smoke]
description = "Smoke test only the extracted CLI and LSP release archives for NATIVE_TARGET"
script_runner = "@shell"
script = '''
if [ -z "${NATIVE_TARGET:-}" ] || [ -z "${NATIVE_ARTIFACT_DIR:-}" ]; then
  echo "NATIVE_TARGET and NATIVE_ARTIFACT_DIR are required" >&2
  exit 2
fi
node tools/native-release-smoke.mjs "$NATIVE_ARTIFACT_DIR" "$NATIVE_TARGET"
'''

[tasks.native-artifact-smoke]
description = "Smoke test local release archives for the current operating system"
command = "node"
args = ["tools/local-native-check.mjs", "smoke"]

[tasks.installation-e2e]
description = "Install and remove a local release candidate for the current operating system"
command = "node"
args = ["tools/local-native-check.mjs", "installation"]

[tasks.native-release-smoke-host]
description = "Exercise archive and binary smoke logic with local host binaries"
dependencies = ["build"]
script_runner = "@shell"
script = '''
root="target/native-smoke-host"
artifacts="$root/artifacts"
rm -rf "$root"
mkdir -p "$artifacts"
for package in adocweave-cli adocweave-lsp; do
  case "$package" in
    adocweave-cli) executable="adocweave" ;;
    adocweave-lsp) executable="adocweave-lsp" ;;
  esac
  archive_root="$package-x86_64-unknown-linux-musl"
  stage="$root/$archive_root"
  mkdir -p "$stage"
  cp "target/debug/$executable" "$stage/$executable"
  cp README.adoc LICENSE-MIT LICENSE-APACHE "$stage/"
  node tools/generate-third-party-notices.mjs "$stage/THIRD_PARTY_NOTICES.adoc"
  archive="$(pwd)/$artifacts/$archive_root.zip"
  (
    cd "$stage"
    zip -X -q "$archive" \
      "$executable" README.adoc LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.adoc
  )
done
ADOCWEAVE_SMOKE_ALLOW_DYNAMIC=1 \
  node tools/native-release-smoke.mjs "$artifacts" x86_64-unknown-linux-musl
'''

[tasks.release-installation-e2e-host]
description = "Install, select, and completely uninstall locally built release archives in an isolated home"
dependencies = [
  "native-release-smoke-host",
  "package-browser-release",
  "package-zed-release",
  "test-vscode-release-package",
]
script_runner = "@shell"
script = '''
candidate="target/release-installation-e2e-host"
rm -rf "$candidate"
mkdir -p "$candidate"
cp target/native-smoke-host/artifacts/*.zip "$candidate/"
cp target/distrib/adocweave-browser-*.tar.xz "$candidate/"
cp target/distrib/adocweave-zed-*.tar.xz "$candidate/"
cp target/distrib/adocweave-vscode-*.vsix "$candidate/"
node tools/release-installation-e2e.mjs \
  "$candidate" x86_64-unknown-linux-musl release-manifest.json
'''

[tasks.dist-plan]
description = "Run the pinned dist release plan without publishing"
script_runner = "@shell"
script = '''
version="$(node --input-type=module -e "import manifest from './release-manifest.json' with { type: 'json' }; process.stdout.write(manifest.packageVersion)")"
plan="$(mktemp "${TMPDIR:-/tmp}/adocweave-dist-plan.XXXXXX.json")"
trap 'rm -f "$plan"' EXIT
node tools/generate-third-party-notices.mjs THIRD_PARTY_NOTICES.adoc
dist plan --tag="v$version" --output-format=json > "$plan"
node tools/verify-dist-plan.mjs "$plan" "v$version"
'''

[tasks.check-wasm]
description = "Type-check the WASM adapter for wasm32-unknown-unknown"
command = "cargo"
args = [
  "check",
  "-p",
  "adocweave-wasm",
  "--target",
  "wasm32-unknown-unknown",
]

[tasks.build-wasm]
description = "Build wasm-bindgen web artifacts with the fast release profile for local iteration"
script_runner = "@shell"
script = '''
export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$(pwd)=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home"
cargo build -p adocweave-wasm --release --target wasm32-unknown-unknown
wasm-bindgen \
  --target web \
  --out-dir target/adocweave-wasm-dev \
  target/wasm32-unknown-unknown/release/adocweave_wasm.wasm
'''

[tasks.package-browser-release]
description = "Build the deterministic browser extra artifact consumed by dist"
command = "bash"
args = ["tools/package-browser-release.sh"]

[tasks.package-zed-release]
description = "Build the deterministic source-checkout-free Zed development extension archive"
dependencies = ["zed-query-contract"]
command = "bash"
args = ["tools/package-zed-release.sh"]

[tasks.test-zed-release-package]
description = "Verify the Zed release archive layout and deterministic bytes"
dependencies = ["package-zed-release"]
script_runner = "@shell"
script = '''
version="$(node --input-type=module -e "import manifest from './release-manifest.json' with { type: 'json' }; process.stdout.write(manifest.packageVersion)")"
archive="target/distrib/adocweave-zed-$version.tar.xz"
first="$(sha256sum "$archive" | cut -d ' ' -f 1)"
cargo make package-zed-release >/dev/null
second="$(sha256sum "$archive" | cut -d ' ' -f 1)"
if [ "$first" != "$second" ]; then
  echo "Zed release archive is not deterministic" >&2
  exit 1
fi
node tools/zed-release-smoke.mjs "$archive"
'''

[tasks.test-browser-release-package]
description = "Verify browser release archive layout and deterministic bytes"
dependencies = ["package-browser-release"]
script_runner = "@shell"
script = '''
version="$(node --input-type=module -e "import manifest from './release-manifest.json' with { type: 'json' }; process.stdout.write(manifest.packageVersion)")"
package="adocweave-browser-$version"
archive="target/distrib/adocweave-browser-$version.tar.xz"
first="$(sha256sum "$archive" | cut -d ' ' -f 1)"
cargo make package-browser-release >/dev/null
second="$(sha256sum "$archive" | cut -d ' ' -f 1)"
if [ "$first" != "$second" ]; then
  echo "browser release archive is not deterministic" >&2
  exit 1
fi

actual="$(mktemp "${TMPDIR:-/tmp}/adocweave-browser-archive.XXXXXX.list")"
expected="$(mktemp "${TMPDIR:-/tmp}/adocweave-browser-archive-expected.XXXXXX.list")"
trap 'rm -f "$actual" "$expected"' EXIT
tar -tJf "$archive" | LC_ALL=C sort > "$actual"
printf '%s\n' \
  "$package/" \
  "$package/LICENSE-APACHE" \
  "$package/LICENSE-MIT" \
  "$package/README.adoc" \
  "$package/THIRD_PARTY_NOTICES.adoc" \
  "$package/package.json" \
  "$package/example/" \
  "$package/example/app.mjs" \
  "$package/example/index.html" \
  "$package/wasm/" \
  "$package/wasm/adocweave_wasm.d.ts" \
  "$package/wasm/adocweave_wasm.js" \
  "$package/wasm/adocweave_wasm_bg.wasm" \
  "$package/worker/" \
  "$package/worker/client.mjs" \
  "$package/worker/contracts.mjs" \
  "$package/worker/controller.mjs" \
  "$package/worker/index.d.mts" \
  "$package/worker/index.mjs" \
  "$package/worker/protocol.generated.d.mts" \
  "$package/worker/protocol.generated.mjs" \
  "$package/worker/worker.mjs" | LC_ALL=C sort > "$expected"
diff -u "$expected" "$actual"
root="$(mktemp -d "${TMPDIR:-/tmp}/adocweave-browser-import.XXXXXX")"
trap 'rm -f "$actual" "$expected"; rm -rf "$root"' EXIT
tar -xJf "$archive" -C "$root"
node --input-type=module -e '
  const contracts = await import(process.argv[1]);
  if (contracts.PACKAGE_VERSION !== process.argv[2]) throw new Error("browser archive package version mismatch");
' "$root/$package/worker/contracts.mjs" "$version"
echo "browser release package verified: $second"
'''

[tasks.test-browser-types]
description = "Compile-check the public browser TypeScript declarations"
command = "tsc"
args = ["--project", "web-worker/tsconfig.json"]

[tasks.test-browser-smoke]
description = "Run the extracted browser archive in isolated and fallback Chromium contexts"
dependencies = ["package-browser-release", "test-browser-types"]
script_runner = "@shell"
script = '''
node --test tools/process-lifecycle.test.mjs tools/host-executable.test.mjs
version="$(node --input-type=module -e "import manifest from './release-manifest.json' with { type: 'json' }; process.stdout.write(manifest.packageVersion)")"
node tools/browser-release-smoke.mjs "target/distrib/adocweave-browser-$version.tar.xz" "${ADOCWEAVE_BROWSER:-chromium}"
'''

[tasks.test-browser-bundler]
description = "Bundle the public browser API with esbuild and smoke test its asset URL resolution"
dependencies = ["package-browser-release", "test-browser-types"]
script_runner = "@shell"
script = '''
version="$(node --input-type=module -e "import manifest from './release-manifest.json' with { type: 'json' }; process.stdout.write(manifest.packageVersion)")"
package="adocweave-browser-$version"
source_archive="target/distrib/$package.tar.xz"
root="$(mktemp -d "${TMPDIR:-/tmp}/adocweave-browser-bundler.XXXXXX")"
archive="$root/$package-bundled.tar.xz"
trap 'rm -rf "$root"' EXIT
tar -xJf "$source_archive" -C "$root"
esbuild web-worker/bundler-entry.mjs \
  --bundle --format=esm --platform=browser \
  --outfile="$root/$package/example/app.mjs"
tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
  -cJf "$archive" -C "$root" "$package"
node tools/browser-release-smoke.mjs "$archive" "${ADOCWEAVE_BROWSER:-chromium}"
'''

[tasks.release-global-artifacts]
description = "Build and statically verify the exact browser, Zed, and VS Code archives uploaded by release CI"
dependencies = [
  "test-browser-release-package",
  "test-browser-types",
  "test-zed-release-package",
  "test-vscode-release-package",
]

[tasks.release-global-candidate]
description = "Build and runtime-test the exact global archives uploaded by candidate CI"
dependencies = ["release-global-artifacts", "browser-runtime-check"]

[tasks.browser-runtime-check]
description = "Run the release-intent browser archive in isolated, fallback, and bundler Chromium paths"
dependencies = ["test-browser-smoke", "test-browser-bundler"]

[tasks.build-wasm-node]
description = "Build wasm-bindgen Node.js artifacts for cross-runtime conformance"
script_runner = "@shell"
script = '''
export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$(pwd)=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home"
cargo build -p adocweave-wasm --release --target wasm32-unknown-unknown
wasm-bindgen \
  --target nodejs \
  --out-dir target/adocweave-wasm-node \
  target/wasm32-unknown-unknown/release/adocweave_wasm.wasm
'''

[tasks.build-conformance-native]
description = "Build the native JSON conformance adapter"
command = "cargo"
args = ["build", "-p", "adocweave-wasm", "--bin", "adocweave-conformance-native"]

[tasks.html5-check]
description = "Validate generated fragment and complete-document HTML with Nu Html Checker"
dependencies = ["build-adoc-check", "build-conformance-native"]
command = "nix"
args = ["develop", ".#html5", "-c", "node", "tools/html5-check.mjs"]

[tasks.test-cross-runtime]
description = "Compare native and actual WASM results over shared conformance fixtures"
dependencies = ["build-conformance-native", "build-wasm-node"]
command = "npm"
args = ["run", "test:cross-runtime", "--prefix", "web-worker"]

[tasks.wasm-size]
description = "Report the byte sizes of the browser artifacts that ship"
dependencies = ["package-browser-release"]
script_runner = "@shell"
script = '''
# package-browser-release leaves the browser profile wasm-bindgen output here and
# copies it into the archive, so these are the bytes consumers download.
for artifact in target/adocweave-wasm/*; do
  bytes="$(wc -c < "$artifact")"
  echo "$bytes $artifact"
done
version="$(node --input-type=module -e "import manifest from './release-manifest.json' with { type: 'json' }; process.stdout.write(manifest.packageVersion)")"
archive="target/distrib/adocweave-browser-$version.tar.xz"
echo "$(wc -c < "$archive") $archive"
'''

[tasks.test-grammar]
description = "Run normative grammar and substitution contract tests"
command = "cargo"
args = ["test", "-p", "adocweave", "--test", "grammar"]

[tasks.test-properties]
description = "Run deterministic parser, renderer, position, and formatter properties"
command = "cargo"
args = ["test", "-p", "adocweave", "--test", "properties"]

[tasks.test-security]
description = "Run adversarial input, resource limit, and cancellation regressions"
command = "cargo"
args = ["test", "-p", "adocweave", "--test", "security"]

[tasks.fuzz-check]
description = "Compile every cargo-fuzz target without running it"
command = "adocweave-fuzz"
args = ["check", "--fuzz-dir", "fuzz"]

[tasks.fuzz-smoke]
description = "Confirm each fuzz target survives its known corpus (set FUZZ_SECONDS to override)"
script_runner = "@shell"
script = '''
seconds="${FUZZ_SECONDS:-5}"
smoke_root="$(mktemp -d "${TMPDIR:-/tmp}/adocweave-fuzz-smoke.XXXXXX")"
trap 'rm -rf "$smoke_root"' EXIT
for target in analyze preprocess process render; do
  corpus="$smoke_root/$target"
  log="$smoke_root/$target.log"
  mkdir -p "$corpus"
  cp -R "fuzz/corpus/$target/." "$corpus/"
  # LeakSanitizer cannot enumerate threads under some sandbox/ptrace hosts.
  # Address/undefined-behavior instrumentation remains enabled.
  if ! ASAN_OPTIONS="${ASAN_OPTIONS:-detect_leaks=0}" \
    adocweave-fuzz run --fuzz-dir fuzz "$target" "$corpus" -- \
    -seed=1 -max_total_time="$seconds" -timeout=2 -verbosity=0 >"$log" 2>&1; then
    cat "$log" >&2
    exit 1
  fi
  echo "fuzz smoke passed: $target (${seconds}s)"
done
'''

[tasks.fuzz]
description = "Compile every fuzz target and confirm the known corpus still passes"
dependencies = ["fuzz-check", "fuzz-smoke"]

[tasks.test-release-core]
private = true
command = "cargo"
args = ["test", "-p", "adocweave-cli", "--test", "cli", "release_fixture"]

[tasks.test-release-lsp]
private = true
command = "cargo"
args = ["test", "-p", "adocweave-lsp", "release_fixture"]

[tasks.test-release]
description = "Run the cross-component initial release fixture tests"
dependencies = ["test-release-core", "test-release-lsp"]

[tasks.test-profile-release]
description = "Run versioned core-profile and cross-runtime release contracts"
dependencies = ["test-release", "test-cross-runtime"]
command = "cargo"
args = ["test", "-p", "adocweave-wasm", "--test", "conformance"]

[tasks.check-zed]
description = "Type-check the excluded Zed extension crate"
dependencies = ["zed-query-contract"]
command = "cargo"
args = ["check", "--manifest-path", "editors/zed/Cargo.toml"]

[tasks.zed-query-contract]
description = "Verify Zed highlight and injection queries against the pinned grammar node schema"
command = "node"
args = ["tools/zed-query-contract.mjs"]

[tasks.check-zed-wasm]
description = "Type-check the Zed extension for the host target used by Zed"
command = "cargo"
args = [
  "check",
  "--manifest-path",
  "editors/zed/Cargo.toml",
  "--target",
  "wasm32-wasip2",
]

[tasks.test-zed]
description = "Test release selection, integrity verification, extraction, and cache behavior in the Zed adapter"
command = "cargo"
args = ["test", "--manifest-path", "editors/zed/Cargo.toml"]

[tasks.vscode-dependencies]
description = "Install the locked VS Code extension dependencies without lifecycle scripts"
command = "npm"
args = ["ci", "--ignore-scripts", "--prefix", "editors/vscode"]

[tasks.check-vscode]
description = "Type-check and validate the VS Code extension manifest and TextMate grammar"
dependencies = ["vscode-dependencies"]
command = "npm"
args = ["run", "check", "--prefix", "editors/vscode"]

[tasks.test-vscode]
description = "Run the VS Code adapter, managed binary, and package contract tests"
dependencies = ["vscode-dependencies"]
command = "npm"
args = ["test", "--prefix", "editors/vscode"]

[tasks.test-vscode-extension-host]
description = "Run the official VS Code extension host against the real AdocWeave Language Server"
dependencies = ["build", "check-vscode", "test-vscode"]
script_runner = "@shell"
script = '''
npm run build --prefix editors/vscode
if [ "$(uname -s)" = Linux ]; then
  Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
  xvfb_pid=$!
  trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
  DISPLAY=:99 npm run test:extension --prefix editors/vscode
else
  npm run test:extension --prefix editors/vscode
fi
'''

[tasks.test-vscode-release-package]
description = "Build a deterministic VSIX and verify contents and installation lifecycle"
dependencies = ["check-vscode", "test-vscode"]
script_runner = "@shell"
script = '''
npm run package --prefix editors/vscode
npm run test:vsix --prefix editors/vscode
node --test editors/vscode/scripts/exit-after-successful-cleanup.test.mjs
npm run test:vsix-installation --prefix editors/vscode
'''

[tasks.clippy-zed]
description = "Run Clippy for the excluded Zed extension crate"
command = "cargo"
args = [
  "clippy",
  "--manifest-path",
  "editors/zed/Cargo.toml",
  "--",
  "-D",
  "warnings",
]

[tasks.run-lsp]
description = "Run the Language Server over standard input/output"
command = "cargo"
args = ["run", "-p", "adocweave-lsp", "--bin", "adocweave-lsp"]

[tasks.doc-check]
description = "Build workspace API documentation without dependencies"
env = { "RUSTDOCFLAGS" = "-D warnings" }
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps"]

[tasks.docs-check]
description = "Reject documentation .md files except repository metadata"
script_runner = "@shell"
script = '''
unexpected="$(rg --files --hidden -g '*.md' -g '!.git/**' | rg -v '^(AGENTS\.md|\.github/pull_request_template\.md|\.github/SECURITY\.md)$' || true)"
if [ -n "$unexpected" ]; then
  echo "repository documentation must use .adoc except repository metadata:" >&2
  echo "$unexpected" >&2
  exit 1
fi
'''

[tasks.build-adoc-check]
private = true
command = "cargo"
args = ["build", "-p", "adocweave-cli", "--bin", "adocweave"]

[tasks.adoc-check-targets]
private = true
command = "node"
args = ["--test", "tools/adoc-check.test.mjs"]

[tasks.adoc-check]
description = "Check every tracked AsciiDoc file for crashes, losslessness, and valid ranges"
dependencies = ["build-adoc-check", "adoc-invariants", "adoc-check-targets"]
command = "node"
args = ["tools/adoc-check.mjs"]

[tasks.adoc-invariants]
private = true
command = "cargo"
args = [
  "test",
  "-p",
  "adocweave-governance",
  "--test",
  "repository_governance",
  "tracked_adoc_corpus_is_lossless_and_has_valid_ranges",
]

[tasks.docs-lint]
description = "Reject unexpected diagnostics in normative documents and abnormal fixtures"
command = "cargo"
args = ["test", "-p", "adocweave-governance", "--test", "repository_governance"]

[tasks.build]
description = "Build all workspace targets and features"
command = "cargo"
args = ["build", "--workspace", "--all-targets", "--all-features"]

[tasks.nix-package-check]
description = "Build and run the native Nix package and NixOS installation check"
script_runner = "@shell"
script = '''
set -euo pipefail
system="$(nix eval --raw --impure --expr builtins.currentSystem)"
version="$(jq -er .packageVersion release-manifest.json)"
nix flake check --no-build
nix build \
  ".#checks.${system}.public-contract" \
  ".#checks.${system}.package-smoke" \
  ".#checks.${system}.nixos-package-evaluation" \
  --no-link
nix run . -- --version --json | jq -e --arg version "$version" '.packageVersion == $version' >/dev/null
'''

[tasks.candidate-path-audit]
description = "Reject tracked paths without an explicit release candidate impact classification"
script_runner = "@shell"
script = '''
git ls-files | node tools/native-change-plan.mjs --audit
'''

[tasks.ci-preflight]
description = "Run inexpensive common checks before release candidate builds"
dependencies = [
  "fmt-check",
  "protocol-generated-check",
  "release-contract",
  "workflow-lint",
  "candidate-path-audit",
]

[tasks.quality-fast]
