name: Native artifact smoke

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: target/distrib
      # This job also runs on macOS and Windows runners, so it cannot use the Nix
      # devShell. Writing the Node.js version here would split it from the release
      # manifest, so the manifest value is read and handed to setup-node.
      - name: Resolve the pinned Node.js version
        id: node-version
        shell: bash
        run: echo "value=$(jq -er .nodeVersion release-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.value }}
      - name: Resolve the Visual C++ dependency inspector
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          "ADOCWEAVE_DUMPBIN=$($dumpbin.FullName)" >> $env:GITHUB_ENV
      - name: Extracted release binary smoke tests
        run: node tools/native-release-smoke.mjs target/distrib "${{ matrix.target }}"
