name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.plan.outputs.tag }}
      publishing: ${{ steps.plan.outputs.publishing }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication tag verification against the current main commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - id: candidate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA&per_page=100")"
          run_id="$(jq -r '[.[].workflow_runs[] | select(.head_branch == "main" and .head_sha == env.GITHUB_SHA and .conclusion == "success") | .id] | max // empty' <<<"$runs")"
          if [ -z "$run_id" ]; then
            echo "no successful main candidate exists for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            candidate_tag="$RELEASE_TAG"
            publishing=true
          else
            candidate_tag="v$(jq -r .packageVersion release-manifest.json)"
            publishing=false
          fi
          tools/run-pinned-dist.sh plan --tag="$candidate_tag" --output-format=json > plan.json
          {
            echo "manifest=$(jq -c . plan.json)"
            echo "tag=$candidate_tag"
            echo "publishing=$publishing"
          } >> "$GITHUB_OUTPUT"

  quality:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      run_nix_package: ${{ github.event_name == 'pull_request' }}

  build-native:
    if: github.ref == 'refs/heads/main'
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            build: nix
          - target: aarch64-apple-darwin
            runner: macos-15
            build: nix
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build: nix
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            build: nix
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            build: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.build == 'nix'
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Native build linker installation
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Target archive builds
        if: matrix.build == 'nix'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=("--tag=$RELEASE_TAG"); fi
          nix develop .#ci -c tools/run-pinned-dist.sh build "${args[@]}" --artifacts=local --target="${{ matrix.target }}" --output-format=json > dist-manifest.json
      - name: Fixed Windows Rust and cargo-dist installation
        if: matrix.build == 'windows'
        shell: pwsh
        run: |
          $rustVersion = (Get-Content release-manifest.json | ConvertFrom-Json).rustVersion
          $distVersion = (Get-Content release/distribution-plan.json | ConvertFrom-Json).distVersion
          rustup toolchain install $rustVersion --profile minimal --target "${{ matrix.target }}"
          rustup override set $rustVersion
          cargo install cargo-dist --version "=$distVersion" --locked
          if ((dist --version) -ne "cargo-dist $distVersion") {
            throw "cargo-dist version mismatch"
          }
      - name: Windows target archive builds
        if: matrix.build == 'windows'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: pwsh
        run: |
          node tools/generate-third-party-notices.mjs THIRD_PARTY_NOTICES.adoc
          $arguments = @("build", "--artifacts=local", "--target=${{ matrix.target }}", "--output-format=json")
          if ($env:RELEASE_TAG) {
            $arguments += "--tag=$env:RELEASE_TAG"
          }
          dist @arguments | Out-File -Encoding utf8 dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-local-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/distrib/adocweave-cli-${{ matrix.target }}.zip
            target/distrib/adocweave-lsp-${{ matrix.target }}.zip

  native-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [plan, build-native]
    uses: ./.github/workflows/native-artifact-smoke.yml
    with:
      plan: ${{ needs.plan.outputs.manifest }}

  build-global:
    if: github.ref == 'refs/heads/main'
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Browser, Zed, and VS Code artifact build and verification
        run: nix develop .#ci -c cargo make release-global-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-global
          if-no-files-found: error
          retention-days: 7
          path: |
            target/distrib/adocweave-browser-*.tar.xz
            target/distrib/adocweave-zed-*.tar.xz
            target/distrib/adocweave-vscode-*.vsix

  verify-candidate:
    if: github.ref == 'refs/heads/main'
    needs: [plan, native-smoke, build-global]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      - name: Complete candidate metadata generation and verification
        run: |
          node tools/release-metadata.mjs generate artifacts "$GITHUB_SHA"
          node tools/release-metadata.mjs verify artifacts "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 14
          path: artifacts/*

  installation-e2e:
    if: github.ref == 'refs/heads/main'
    needs: [verify-candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nix-system: aarch64-linux
            nix: true
          - target: aarch64-apple-darwin
            runner: macos-15
            nix: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            nix-system: x86_64-linux
            nix: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            nix: false
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            nix: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Nix package build and execution
        if: matrix.nix
        run: >-
          nix build
          ".#checks.${{ matrix.nix-system }}.public-contract"
          ".#checks.${{ matrix.nix-system }}.package-smoke"
          ".#checks.${{ matrix.nix-system }}.nixos-package-evaluation"
          --no-link
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts
      - name: Candidate installation and complete removal
        run: node tools/release-installation-e2e.mjs artifacts "${{ matrix.target }}"

  reuse-candidate:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.candidate_run_id }}
      - name: Reused candidate verification
        run: node tools/release-metadata.mjs verify artifacts "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 1
          path: artifacts/*

  publish:
    if: needs.plan.outputs.publishing == 'true'
    needs: [plan, reuse-candidate]
    uses: ./.github/workflows/release-publish.yml
    with:
      plan: ${{ needs.plan.outputs.manifest }}
    permissions:
      attestations: write
      contents: write
      id-token: write
