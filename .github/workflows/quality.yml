name: Quality gate

on:
  workflow_call:
    inputs:
      common_preflight_scheduled:
        required: false
        type: boolean
        default: false
      run_nix_package:
        required: false
        type: boolean
        default: true
      save_build_cache:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Dependency boundary audit
        run: nix develop .#ci -c cargo make dependency-governance

  source-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Complete fast source policy execution
        if: ${{ !inputs.common_preflight_scheduled }}
        run: nix develop .#ci -c cargo make quality-fast
      - name: Fast source policy execution after candidate preflight
        if: ${{ inputs.common_preflight_scheduled }}
        run: nix develop .#ci -c cargo make quality-fast-after-preflight

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Locked toolchain exposure for dependency caching
        run: nix develop .#ci -c bash -c 'command -v cargo' | xargs dirname >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: quality-rust
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ inputs.save_build_cache }}
      - name: Rust source gate execution
        run: nix develop .#ci -c cargo make quality-rust

  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Locked toolchain exposure for dependency caching
        run: nix develop .#ci -c bash -c 'command -v cargo' | xargs dirname >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: quality-adapters
          key: ${{ hashFiles('flake.lock') }}
          workspaces: |
            .
            editors/zed
          save-if: ${{ inputs.save_build_cache }}
      - name: Adapter source gate execution
        run: nix develop .#ci -c cargo make quality-adapters

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Fuzz target compilation and exploration
        run: nix develop .#ci-fuzz -c cargo make fuzz

  nix-package:
    if: inputs.run_nix_package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Nix package build and execution
        run: nix develop .#ci -c cargo make nix-package-check

  semver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The gate builds rustdoc for the baseline tag as well as the candidate,
      # so it needs the tags and the commits they point at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - name: Public Rust API compatibility against the previous stable tag
        run: nix develop .#ci-semver -c cargo make semver-check

  aggregate:
    if: always()
    needs: [source-fast, rust, adapters, dependencies, fuzz, nix-package, semver]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required quality result aggregation
        env:
          ADAPTERS_RESULT: ${{ needs.adapters.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          NIX_PACKAGE_REQUIRED: ${{ inputs.run_nix_package }}
          NIX_PACKAGE_RESULT: ${{ needs.nix-package.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SOURCE_FAST_RESULT: ${{ needs.source-fast.result }}
        run: |
          test "$SOURCE_FAST_RESULT" = success
          test "$RUST_RESULT" = success
          test "$ADAPTERS_RESULT" = success
          test "$DEPENDENCIES_RESULT" = success
          test "$FUZZ_RESULT" = success
          if [ "$NIX_PACKAGE_REQUIRED" = true ]; then
            test "$NIX_PACKAGE_RESULT" = success
          else
            test "$NIX_PACKAGE_RESULT" = skipped
          fi
