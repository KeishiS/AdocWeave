name: Release publish

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      plan:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts
      - name: Immutable release input verification
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="$(jq -r '.announcement_tag' <<<"$PLAN")"
          test -n "$tag"
          test "$tag" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          node tools/release-contract.mjs "--tag=$tag"
          node tools/release-metadata.mjs verify artifacts "$CANDIDATE_SHA"
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          existing="$(jq --arg tag "$tag" -r '.[][] | select(.tag_name == $tag) | .id' <<<"$releases")"
          if [ -n "$existing" ]; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          node tools/release-readiness.mjs --assert-tag-absent "$tag"
      - name: Public asset attestations
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/*
      - name: Scoped publisher token
        id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
      - name: Immutable stable tag creation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="AdocWeave $RELEASE_TAG" \
            -f object="$CANDIDATE_SHA" \
            -f type=commit)"
          tag_sha="$(jq -er .sha <<<"$tag_object")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_sha" >/dev/null
      - name: Private draft creation and verification
        id: draft
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          PLAN: ${{ inputs.plan }}
        run: |
          tag="$(jq -r '.announcement_tag' <<<"$PLAN")"
          title="$(jq -r '.announcement_title' <<<"$PLAN")"
          body="$(jq -r '.announcement_github_body' <<<"$PLAN")"
          body="$(node tools/release-notes.mjs "$tag" <<<"$body")"
          draft="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" \
            -f name="$title" \
            -f body="$body" \
            -F draft=true \
            -F prerelease=false)"
          release_id="$(jq -r '.id' <<<"$draft")"
          upload_url="$(jq -r '.upload_url' <<<"$draft")"
          upload_url="${upload_url%%\{*}"
          test "$release_id" != null
          test -n "$upload_url"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          for file in artifacts/*; do
            name="${file##*/}"
            gh api --method POST \
              --header 'Content-Type: application/octet-stream' \
              --input "$file" \
              "$upload_url?name=$name" >/dev/null
          done
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          expected="$(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual="$(jq -r '.assets[].name' <<<"$draft" | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "draft release asset set mismatch" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          fi
      - name: Complete release publication
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        run: |
          result="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false)"
          test "$(jq -r '.draft' <<<"$result")" = false
      - name: Incomplete draft removal
        if: failure()
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "draft release ID is unavailable; cleanup is not attempted"
            exit 0
          fi
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" 2>/dev/null || true)"
          if [ "$(jq -r '.draft // false' <<<"${draft:-{}}")" = true ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi
