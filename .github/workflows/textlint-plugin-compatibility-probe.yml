name: textlint Plugin Compatibility Probe

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textlint-plugin-compatibility-probe
  cancel-in-progress: false

jobs:
  observe-latest-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Build, verify, and observe the latest compatible dependency resolution
        run: nix develop .#ci -c cargo make textlint-plugin-compatibility-probe
