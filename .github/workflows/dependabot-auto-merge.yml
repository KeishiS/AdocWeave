name: Dependabot auto-merge controller

on:
  workflow_run:
    workflows: ["CI and Release", "Dependabot review signal"]
    types: [completed]

permissions: {}

concurrency:
  group: >-
    dependabot-auto-merge-${{
      github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id
    }}
  cancel-in-progress: false

jobs:
  decide:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null &&
      (
        (
          github.event.workflow_run.name == 'CI and Release' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.actor.login == 'dependabot[bot]'
        ) ||
        (
          github.event.workflow_run.name == 'Dependabot review signal' &&
          github.event.workflow_run.event == 'pull_request_review'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      vulnerability-alerts: read
    outputs:
      eligible: ${{ steps.decision.outputs.eligible }}
      expected_base_sha: ${{ steps.context.outputs.base_sha }}
      expected_head_oid: ${{ steps.context.outputs.head_sha }}
      pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      pull_request_node_id: ${{ steps.context.outputs.node_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          persist-credentials: false
      - name: Read current GitHub state
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | jq -Rsc 'split("\n") | map(select(length > 0))' > changed-files.json
          head_sha="$(jq -r .head.sha pr.json)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100" \
            --jq '.check_runs' | jq -s 'add' > checks.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq -s 'add' > reviews.json
          gh api "repos/$GITHUB_REPOSITORY/branches/$(jq -r .base.ref pr.json)" \
            --jq .commit.sha > base-sha.txt
          tools/dependabot-alert-snapshot.sh \
            "$GITHUB_REPOSITORY" '[]' "$(cat changed-files.json)" \
            > security-alert-snapshot.json
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$head_sha&status=success&per_page=100" \
            --jq '.workflow_runs' \
            | jq -e -s \
                --arg base_sha "$(cat base-sha.txt)" \
                --arg head_sha "$head_sha" \
                --argjson pr_number "$PR_NUMBER" '
                  add
                  | map(select(
                      .name == "CI and Release"
                      and .event == "pull_request"
                      and .conclusion == "success"
                      and .head_sha == $head_sha
                      and .actor.login == "dependabot[bot]"
                      and any(
                        .pull_requests[]?;
                        .number == $pr_number and .base.sha == $base_sha
                      )
                    ))
                  | sort_by(.updated_at)
                  | (last // error("no successful current-base CI run"))
                  | . + {verified_base_sha: $base_sha}
                ' > ci-run.json
          {
            echo "base_sha=$(cat base-sha.txt)"
            echo "head_sha=$head_sha"
            echo "node_id=$(jq -r .node_id pr.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Evaluate CI completion against the current head
        id: decision
        run: |
          jq -n \
            --arg current_base_sha "$(cat base-sha.txt)" \
            --slurpfile pr pr.json \
            --slurpfile changed_files changed-files.json \
            --slurpfile checks checks.json \
            --slurpfile reviews reviews.json \
            --slurpfile ci_run ci-run.json \
            --slurpfile security_alerts security-alert-snapshot.json \
            '($pr[0]) as $pull |
            ($ci_run[0]) as $ci |
            ($reviews[0] | group_by(.user.login) | map(max_by(.submitted_at))) as $latest_reviews |
            {
              pullRequest: {
                actor: $ci.actor.login,
                author: $pull.user.login,
                baseRef: $pull.base.ref,
                baseRepository: $pull.base.repo.full_name,
                headRef: $pull.head.ref,
                headRepository: $pull.head.repo.full_name,
                headSha: $pull.head.sha,
                baseSha: $pull.base.sha,
                draft: $pull.draft,
                mergeable: $pull.mergeable
              },
              workflowRun: {
                event: $ci.event,
                conclusion: $ci.conclusion,
                headSha: $ci.head_sha,
                baseSha: $ci.verified_base_sha
              },
              currentBaseSha: $current_base_sha,
              securityAlerts: {
                lookupCompleted: $security_alerts[0].lookupCompleted,
                openCount: $security_alerts[0].openCount,
                securityUpdate: $security_alerts[0].securityUpdate
              },
              changedFiles: $changed_files[0],
              review: {
                changesRequested: any($latest_reviews[]?; .state == "CHANGES_REQUESTED"),
                approvedCount: ([
                  $latest_reviews[]?
                  | select(.state == "APPROVED" and .user.type == "User")
                ] | length)
              },
              eligibilityCheck: (
                $checks[0]
                | map(select(.name == "dependabot / eligibility"))
                | sort_by(.id)
                | last
                | if . == null then null else {
                    id, name, headSha: .head_sha, conclusion,
                    appSlug: .app.slug, appId: .app.id
                  } end
              ),
              checks: (
                $checks[0] | map({
                  id, name, headSha: .head_sha, conclusion,
                  completedAt: .completed_at, appId: .app.id
                })
              )
            }' > controller-input.json
          node tools/dependabot-auto-merge-policy.mjs \
            controller .github/dependabot-auto-merge-policy.json controller-input.json \
            > controller-decision.json
          echo "eligible=$(jq -r .eligible controller-decision.json)" >> "$GITHUB_OUTPUT"
          jq . controller-decision.json >> "$GITHUB_STEP_SUMMARY"

  revoke:
    needs: decide
    if: >-
      always() &&
      needs.decide.outputs.eligible != 'true' &&
      github.event.workflow_run.pull_requests[0] != null &&
      (
        (
          github.event.workflow_run.name == 'CI and Release' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.actor.login == 'dependabot[bot]'
        ) ||
        (
          github.event.workflow_run.name == 'Dependabot review signal' &&
          github.event.workflow_run.event == 'pull_request_review' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Disable stale or ineligible Dependabot auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > revoke-pr.json
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .user.login == "dependabot[bot]"
            and .base.ref == "main"
            and .base.repo.full_name == $repository
            and .head.repo.full_name == $repository
            and (.head.ref | startswith("dependabot/"))
          ' revoke-pr.json > /dev/null
          if jq -e '.auto_merge != null' revoke-pr.json > /dev/null; then
            # shellcheck disable=SC2016
            gh api graphql \
              -f query='
                mutation($pullRequest: ID!) {
                  disablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequest
                  }) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }' \
              -f pullRequest="$(jq -r .node_id revoke-pr.json)" \
              | jq . >> "$GITHUB_STEP_SUMMARY"
          fi

  enable:
    needs: decide
    if: needs.decide.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.expected_base_sha }}
          persist-credentials: false
      - name: Enable GitHub-managed auto-merge for the verified head
        env:
          EXPECTED_BASE_SHA: ${{ needs.decide.outputs.expected_base_sha }}
          EXPECTED_HEAD_OID: ${{ needs.decide.outputs.expected_head_oid }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          PULL_REQUEST_NODE_ID: ${{ needs.decide.outputs.pull_request_node_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > enable-pr.json
          test "$(jq -r .node_id enable-pr.json)" = "$PULL_REQUEST_NODE_ID"
          test "$(jq -r .head.sha enable-pr.json)" = "$EXPECTED_HEAD_OID"
          test "$(jq -r .base.sha enable-pr.json)" = "$EXPECTED_BASE_SHA"
          test "$(jq -r .base.ref enable-pr.json)" = "main"
          gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch \
            > enable-default-branch.txt
          test "$(cat enable-default-branch.txt)" = "main"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha \
            > enable-base-sha.txt
          test "$(cat enable-base-sha.txt)" = "$EXPECTED_BASE_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' \
            | jq -Rsc 'split("\n") | map(select(length > 0))' \
            > enable-changed-files.json
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_OID/check-runs?per_page=100" \
            --jq '.check_runs' | jq -s 'add' > enable-checks.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq -s 'add' > enable-reviews.json
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$EXPECTED_HEAD_OID&status=success&per_page=100" \
            --jq '.workflow_runs' \
            | jq -e -s \
                --arg base_sha "$EXPECTED_BASE_SHA" \
                --arg head_sha "$EXPECTED_HEAD_OID" \
                --argjson pr_number "$PR_NUMBER" '
                  add
                  | map(select(
                      .name == "CI and Release"
                      and .event == "pull_request"
                      and .conclusion == "success"
                      and .head_sha == $head_sha
                      and .actor.login == "dependabot[bot]"
                      and any(
                        .pull_requests[]?;
                        .number == $pr_number and .base.sha == $base_sha
                      )
                    ))
                  | sort_by(.updated_at)
                  | (last // error("no successful current-base CI run"))
                  | . + {verified_base_sha: $base_sha}
                ' > enable-ci-run.json
          ruleset_ids="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&per_page=100" \
              | jq -er -s '
                  add
                  | map(select(.target == "branch" and .enforcement == "active"))
                  | .[].id
                '
          )"
          test -n "$ruleset_ids"
          : > active-rulesets.jsonl
          while IFS= read -r ruleset_id; do
            gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" \
              >> active-rulesets.jsonl
          done <<< "$ruleset_ids"
          jq -s '{branch: "main", rulesets: .}' active-rulesets.jsonl \
            > strict-ruleset-input.json
          node tools/dependabot-auto-merge-policy.mjs \
            strict-rulesets .github/dependabot-auto-merge-policy.json \
            strict-ruleset-input.json > strict-ruleset-decision.json
          jq -e '.eligible == true' strict-ruleset-decision.json

          # Observe open alerts after every remote check and immediately before
          # the local final decision and auto-merge registration.
          tools/dependabot-alert-snapshot.sh \
            "$GITHUB_REPOSITORY" '[]' "$(cat enable-changed-files.json)" \
            > enable-security-alert-snapshot.json
          jq -n \
            --arg current_base_sha "$(cat enable-base-sha.txt)" \
            --slurpfile pr enable-pr.json \
            --slurpfile changed_files enable-changed-files.json \
            --slurpfile checks enable-checks.json \
            --slurpfile reviews enable-reviews.json \
            --slurpfile ci_run enable-ci-run.json \
            --slurpfile security_alerts enable-security-alert-snapshot.json \
            '($pr[0]) as $pull |
            ($ci_run[0]) as $ci |
            ($reviews[0] | group_by(.user.login) | map(max_by(.submitted_at))) as $latest_reviews |
            {
              pullRequest: {
                actor: $ci.actor.login,
                author: $pull.user.login,
                baseRef: $pull.base.ref,
                baseRepository: $pull.base.repo.full_name,
                headRef: $pull.head.ref,
                headRepository: $pull.head.repo.full_name,
                headSha: $pull.head.sha,
                baseSha: $pull.base.sha,
                draft: $pull.draft,
                mergeable: $pull.mergeable
              },
              workflowRun: {
                event: $ci.event,
                conclusion: $ci.conclusion,
                headSha: $ci.head_sha,
                baseSha: $ci.verified_base_sha
              },
              currentBaseSha: $current_base_sha,
              securityAlerts: {
                lookupCompleted: $security_alerts[0].lookupCompleted,
                openCount: $security_alerts[0].openCount,
                securityUpdate: $security_alerts[0].securityUpdate
              },
              changedFiles: $changed_files[0],
              review: {
                changesRequested: any($latest_reviews[]?; .state == "CHANGES_REQUESTED"),
                approvedCount: ([
                  $latest_reviews[]?
                  | select(.state == "APPROVED" and .user.type == "User")
                ] | length)
              },
              eligibilityCheck: (
                $checks[0]
                | map(select(.name == "dependabot / eligibility"))
                | sort_by(.id)
                | last
                | if . == null then null else {
                    id, name, headSha: .head_sha, conclusion,
                    appSlug: .app.slug, appId: .app.id
                  } end
              ),
              checks: (
                $checks[0] | map({
                  id, name, headSha: .head_sha, conclusion,
                  completedAt: .completed_at, appId: .app.id
                })
              )
            }' > enable-controller-input.json
          node tools/dependabot-auto-merge-policy.mjs \
            controller .github/dependabot-auto-merge-policy.json \
            enable-controller-input.json > enable-controller-decision.json
          jq -e '.eligible == true' enable-controller-decision.json
          client_mutation_id="dependabot-auto-merge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PR_NUMBER"
          jq -n \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg pullRequestNumber "$PR_NUMBER" \
            --arg clientMutationId "$client_mutation_id" \
            --arg headSha "$EXPECTED_HEAD_OID" \
            --arg baseSha "$EXPECTED_BASE_SHA" \
            --slurpfile alerts enable-security-alert-snapshot.json \
            --slurpfile controller enable-controller-decision.json \
            --slurpfile ruleset strict-ruleset-decision.json \
            '{
              workflowRunId: $workflowRunId,
              workflowRunAttempt: $workflowRunAttempt,
              pullRequestNumber: ($pullRequestNumber | tonumber),
              clientMutationId: $clientMutationId,
              headSha: $headSha,
              baseSha: $baseSha,
              alertObservation: $alerts[0],
              controllerDecision: $controller[0],
              strictRulesetDecision: $ruleset[0]
            }' > enable-audit-record.json
          jq . enable-audit-record.json >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='
              mutation(
                $pullRequest: ID!,
                $head: GitObjectID!,
                $clientMutationId: String!
              ) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequest,
                  mergeMethod: SQUASH,
                  expectedHeadOid: $head,
                  clientMutationId: $clientMutationId
                }) {
                  clientMutationId
                  pullRequest { number autoMergeRequest { enabledAt mergeMethod } }
                }
              }' \
            -f pullRequest="$PULL_REQUEST_NODE_ID" \
            -f head="$EXPECTED_HEAD_OID" \
            -f clientMutationId="$client_mutation_id" \
            > enable-auto-merge-result.json
          jq -e \
            --arg client_mutation_id "$client_mutation_id" \
            --argjson pr_number "$PR_NUMBER" '
            .data.enablePullRequestAutoMerge.clientMutationId == $client_mutation_id
            and .data.enablePullRequestAutoMerge.pullRequest.number == $pr_number
            and (
              .data.enablePullRequestAutoMerge.pullRequest.autoMergeRequest.enabledAt
              | type
            ) == "string"
            and (
              .data.enablePullRequestAutoMerge.pullRequest.autoMergeRequest.mergeMethod
              == "SQUASH"
            )
          ' enable-auto-merge-result.json > /dev/null
          jq . enable-auto-merge-result.json >> "$GITHUB_STEP_SUMMARY"

  revoke-after-enable-failure:
    needs: [decide, enable]
    if: >-
      always() &&
      needs.decide.outputs.eligible == 'true' &&
      needs.enable.result != 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Disable auto-merge after final verification failure
        env:
          EXPECTED_NODE_ID: ${{ needs.decide.outputs.pull_request_node_id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > revoke-after-enable-pr.json
          jq -e \
            --arg expected_node_id "$EXPECTED_NODE_ID" \
            --arg repository "$GITHUB_REPOSITORY" '
              .node_id == $expected_node_id
              and .user.login == "dependabot[bot]"
              and .base.ref == "main"
              and .base.repo.full_name == $repository
              and .head.repo.full_name == $repository
              and (.head.ref | startswith("dependabot/"))
            ' revoke-after-enable-pr.json > /dev/null
          if jq -e '.auto_merge != null' \
            revoke-after-enable-pr.json > /dev/null
          then
            # shellcheck disable=SC2016
            gh api graphql \
              -f query='
                mutation($pullRequest: ID!) {
                  disablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequest
                  }) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }' \
              -f pullRequest="$EXPECTED_NODE_ID" \
              > revoke-after-enable-result.json
            jq -e --argjson pr_number "$PR_NUMBER" '
              .data.disablePullRequestAutoMerge.pullRequest.number == $pr_number
              and .data.disablePullRequestAutoMerge.pullRequest.autoMergeRequest == null
            ' revoke-after-enable-result.json > /dev/null
            jq . revoke-after-enable-result.json >> "$GITHUB_STEP_SUMMARY"
          fi
